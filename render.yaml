# Render Blueprint Specification for InvestDeskPro Full-Stack Platform
services:
  # -------------------------------------------------------------------------
  # Backend: Python FastAPI Microservice (Docker)
  # -------------------------------------------------------------------------
  - type: web
    name: investdeskpro-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"

  # -------------------------------------------------------------------------
  # Frontend: Next.js Web App
  # -------------------------------------------------------------------------
  - type: web
    name: investdeskpro-dashboard
    runtime: node
    plan: standard
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: investdeskpro-api
          property: host
